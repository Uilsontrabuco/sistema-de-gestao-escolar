<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Redefinir senha · 7&7 CAJ</title>
<main><h1>Redefinir senha do administrador</h1><p>A conta, os dados e as permissões serão preservados.</p>
<form id="recovery"><label>Nova senha <input id="password" type="password" autocomplete="new-password" minlength="12" required></label><br>
<label>Confirme a nova senha <input id="confirm" type="password" autocomplete="new-password" minlength="12" required></label><br><button id="submit">Salvar nova senha</button></form>
<p id="message" role="status"></p><a href="/">Voltar ao login</a></main>
<script>
(()=>{'use strict';const params=new URLSearchParams(location.hash.slice(1));let token=params.get('type')==='recovery'?params.get('access_token'):null;history.replaceState(null,'',location.pathname);const form=document.querySelector('#recovery'),message=document.querySelector('#message'),button=document.querySelector('#submit');if(!token){form.hidden=true;message.textContent='Abra esta página pelo link de recuperação enviado ao seu e-mail.';return;}form.addEventListener('submit',async event=>{event.preventDefault();const password=document.querySelector('#password').value;if(password!==document.querySelector('#confirm').value){message.textContent='As senhas não coincidem.';return;}button.disabled=true;try{const response=await fetch('/api/recovery/complete',{method:'POST',credentials:'omit',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});const result=await response.json();if(!response.ok)throw Error(result.error);token=null;form.reset();form.hidden=true;message.textContent='Senha atualizada. Volte ao login e entre com a nova senha.';}catch(error){message.textContent=error.message||'Não foi possível concluir.';}finally{button.disabled=false;}});})();
</script></html>
